name: Dependabot auto-merge

# Turns on auto-merge for every Dependabot pull request. GitHub then merges it
# (squash) once the required checks on main - Ruff, Tests, HACS validation and
# Hassfest validation - have passed; a failing check leaves it open.
# https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions

on:
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'k3mpaxl/ecl310-hacs'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
