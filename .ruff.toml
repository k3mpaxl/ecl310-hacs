# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

# The device library is vendored verbatim from https://github.com/k3mpaxl/ecl310-modbus
# and is linted in its own repository, under its own (narrower) rule set.
exclude = ["custom_components/ecl310/ecl310_modbus"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    # The rest are the ones Home Assistant core ignores as well, so the same
    # code passes here and in a core checkout.
    "CPY001", # Home Assistant sources carry no copyright header
    "D213", # multi-line-summary-second-line (incompatible with D212)
    "RUF012", # mutable class attributes are how entity descriptions are declared
    "TC001", # runtime-evaluated annotations are used by voluptuous and dataclasses
    "TC002",
    "TC003",
    "TC006",
    "TRY003", # long messages outside the exception class
]

[lint.per-file-ignores]
# Tests assert, use literals as expected values, import inside fixtures to
# reach an already-loaded module, and take fixtures they only need for their
# side effects.
"tests/*" = ["S101", "PLR2004", "PLC0415", "ARG001"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
